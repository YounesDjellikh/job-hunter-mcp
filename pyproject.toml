[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-hunter-mcp"
version = "0.2.0"
description = "An MCP server that lets Claude (or any MCP client) search job boards in the UK and Europe, track your applications in a colour-coded Excel sheet, and spot replies, rejections and scams in your Gmail - in 8 languages."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Younes Djellikh" }]
keywords = ["mcp", "claude", "job-search", "job-tracker", "reed", "adzuna", "gmail", "europe", "uk"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "mcp>=1.2",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
gmail = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.2"]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
job-hunter-mcp = "job_hunter_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/job_hunter_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
